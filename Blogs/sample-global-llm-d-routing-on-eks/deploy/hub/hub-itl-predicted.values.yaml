## Hub routing policy "itl-predicted": our cluster-itl-scorer (custom EPP build, llm-d-router
## v0.11.0 + one plugin). Reads each leaf's ITL record from the Valkey registry.
##   best-pod:  rank clusters by their best pod's ITL (the original Redis design).
##   predicted: rank by expected ITL at the cluster's load after this request, using the
##              leaf's fitted ITL-vs-load line and the hub's live in-flight count.
## The same plugin also filters out clusters whose registry record is missing or stale.
router:
  epp:
    image:
      registry: ${ACCOUNT_ID}.dkr.ecr.${REGION}.amazonaws.com
      repository: ${EPP_REPO}
      tag: ${EPP_TAG}
      pullPolicy: Always
    pluginsConfigFile: "multi-cluster-routing-itl.yaml"
    pluginsCustomConfig:
      multi-cluster-routing-itl.yaml: |
        apiVersion: llm-d.ai/v1alpha1
        kind: EndpointPickerConfig
        plugins:
          - type: multicluster-file-discovery
            name: discovery
            parameters:
              path: /etc/epp/clusters/clusters.yaml
              watchFile: true
          - type: cluster-itl-scorer
            name: itl
            parameters:
              redisAddr: ${VALKEY_ENDPOINT}:6379
              redisTLS: true
              mode: predicted
              refreshInterval: 500ms
              staleAfter: 10s
              healthInterval: 1s
              healthFailures: 2
          - type: max-score-picker
            name: picker
          - type: single-profile-handler
            name: profile-handler
        schedulingProfiles:
          - name: default
            plugins:
              - pluginRef: itl
                weight: 1
              - pluginRef: picker
        dataLayer:
          discovery:
            endpoints:
              pluginRef: discovery
