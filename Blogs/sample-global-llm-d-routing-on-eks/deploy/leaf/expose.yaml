# Internal NLB in front of the leaf router (Envoy 8081) and its EPP metrics (9090).
# The hub reaches it over Transit Gateway. Only the test-bed range may connect.
apiVersion: v1
kind: Service
metadata:
  name: leaf-nlb
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  type: LoadBalancer
  loadBalancerSourceRanges: ["10.200.0.0/14"]
  selector:
    llm-d-router-gateway: leaf-epp
  ports:
    - {name: http, port: 80, targetPort: 8081}
    - {name: metrics, port: 9090, targetPort: 9090}
