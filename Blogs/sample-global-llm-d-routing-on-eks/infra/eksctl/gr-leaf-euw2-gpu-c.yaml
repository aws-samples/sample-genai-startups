apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: gr-leaf-euw2
  region: eu-west-2
managedNodeGroups:
  - name: gpu-c
    instanceTypes: [g5.xlarge, g4dn.xlarge]
    desiredCapacity: 2
    minSize: 0
    maxSize: 2
    privateNetworking: true
    volumeSize: 150
    labels: {gr/accel: gpu}
    taints:
      - {key: nvidia.com/gpu, value: present, effect: NoSchedule}
    tags:
      project: global-routing
