apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: gr-leaf-use1
  region: us-east-1
managedNodeGroups:
  - name: gpu
    instanceType: g5.xlarge
    desiredCapacity: 2
    minSize: 0
    maxSize: 2
    privateNetworking: true
    volumeSize: 150
    labels: {gr/accel: gpu}
    taints:
      - {key: nvidia.com/gpu, value: present, effect: NoSchedule}
    tags:
      project: global-routing
