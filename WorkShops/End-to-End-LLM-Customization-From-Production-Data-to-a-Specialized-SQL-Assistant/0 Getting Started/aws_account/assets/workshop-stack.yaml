AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Aurora PostgreSQL Serverless v2 cluster with RDS Data API enabled,
  Secrets Manager integration, and a custom resource that creates and
  populates the product_sales table from a CSV in S3.

Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Environment name for resource tagging

  DBName:
    Type: String
    Default: querytraining
    MinLength: 1
    MaxLength: 63
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9_]*'
    Description: Initial database name

  DBMasterUsername:
    Type: String
    Default: dbadmin
    MinLength: 1
    MaxLength: 63
    AllowedPattern: '[a-zA-Z][a-zA-Z0-9_]*'
    Description: Primary database admin username

  MinACU:
    Type: Number
    Default: 0.5
    MinValue: 0.5
    MaxValue: 128
    Description: Minimum Aurora Capacity Units for Serverless v2 scaling

  MaxACU:
    Type: Number
    Default: 4
    MinValue: 0.5
    MaxValue: 128
    Description: Maximum Aurora Capacity Units for Serverless v2 scaling

  AssetsBucketName:
    Type: String
    Description: Name of the S3 bucket containing workshop assets (cosmetics_sales_synthetic_data.csv and queries.txt)

  AssetsBucketPrefix:
    Type: String
    Description: S3 prefix path for workshop assets in the source bucket

  AuroraEngineVersion:
    Type: String
    Default: '16.11'
    Description: Aurora PostgreSQL engine version for the Serverless v2 cluster

  LambdaRuntime:
    Type: String
    Default: python3.12
    AllowedValues: [python3.12, python3.13]
    Description: >-
      Python runtime for the DbInit and CopyAssets Lambda functions. Both
      functions share one runtime; the inline code targets 3.12+.

  DbInitFunctionTimeout:
    Type: Number
    Default: 900
    MinValue: 60
    MaxValue: 900
    Description: >-
      Timeout (seconds) for DbInitFunction. It seeds product_sales and replays
      ~250 queries serially against a cold Serverless v2 cluster, so it needs
      substantial headroom. 900 is the Lambda maximum.

  DbInitFunctionMemorySize:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 10240
    Description: >-
      Memory (MB) for DbInitFunction. The seed/replay workload is I/O-bound on
      the Data API rather than memory-heavy, so 512 is ample for the ~250-query
      dataset; raise it if the dataset grows substantially. 128-10240 is the
      Lambda-supported range.

  CopyAssetsFunctionTimeout:
    Type: Number
    Default: 300
    MinValue: 30
    MaxValue: 900
    Description: >-
      Timeout (seconds) for CopyAssetsFunction, which copies workshop assets on
      Create and empties both S3 buckets on Delete.

  JupyterLabInstanceType:
    Type: String
    Default: ml.t3.xlarge
    Description: >-
      Instance type for the JupyterLab space. The notebooks run cell-by-cell and
      offload all heavy compute to SageMaker training/evaluation jobs, so a
      modest instance is sufficient.

  DbInitRetryAttempts:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 60
    Description: >-
      How many times DbInitFunction probes the Aurora Data API before giving up,
      while a cold Serverless v2 cluster resumes. attempts x DbInitRetryDelay is
      the maximum wait, so keep the product below the function timeout.

  DbInitRetryDelay:
    Type: Number
    Default: 15
    MinValue: 1
    MaxValue: 60
    Description: >-
      Seconds DbInitFunction waits between Data API resume probes.

  DbInitQueryDelay:
    Type: Number
    Default: 0.1
    MinValue: 0
    MaxValue: 5
    Description: >-
      Seconds DbInitFunction pauses between the ~250 warm-up queries it replays
      into pg_stat_statements. 0 disables the pause; raise it only if the cluster
      throttles under the serial load.

  BackupRetentionPeriod:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 35
    Description: >-
      Days of Aurora automated backup retention. Aurora ALWAYS keeps automated
      backups -- the minimum is 1 day, there is no "off", so this cannot make the
      cluster backup-free. Defaulted to 1 (the minimum) for this disposable
      workshop: backup storage within the cluster's volume size is free, and the
      whole cluster plus its backups is removed on stack delete
      (DeletionPolicy: Delete). Raise it (up to 35) for a non-disposable
      deployment that needs point-in-time recovery.

Resources:
  # ---------------------------------------------------------------------------
  # Secrets Manager
  # ---------------------------------------------------------------------------
  RDSSecret:
    Type: AWS::SecretsManager::Secret
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_149
            comment: >-
              Uses the default aws/secretsmanager key rather than a CMK.
              Disposable, event-scoped secret. See the CMK note in index.en.md
              for the production path.
      Purpose: >-
        Secrets Manager secret holding the Aurora master credentials. The DbInit
        Lambda, the evaluator Lambda and the notebooks all read the DB password
        from here via the RDS Data API rather than embedding it.
    Properties:
      Name: !Sub '${EnvironmentName}/rds/query-training-db'
      Description: Aurora PostgreSQL credentials for query extraction pipeline
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username": "${DBMasterUsername}", "dbname": "${DBName}"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludeCharacters: '"@/\\'
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: query-training-pipeline

  # ---------------------------------------------------------------------------
  # VPC and Networking
  # ---------------------------------------------------------------------------
  VPC:
    Type: AWS::EC2::VPC
    Metadata:
      Purpose: >-
        Isolated network for the Aurora cluster. Two private subnets across two
        AZs; no internet gateway or NAT -- the cluster is reached only through
        the RDS Data API, never a direct network route.
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-query-training-vpc'
        - Key: Environment
          Value: !Ref EnvironmentName

  SubnetA:
    Type: AWS::EC2::Subnet
    Metadata:
      Purpose: >-
        First of two private subnets for the Aurora DB subnet group. Two AZs are
        required by RDS even though this workshop runs a single instance.
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-query-training-subnet-a'
        - Key: Environment
          Value: !Ref EnvironmentName

  SubnetB:
    Type: AWS::EC2::Subnet
    Metadata:
      Purpose: >-
        Second private subnet, in a different AZ from SubnetA, to satisfy the
        RDS multi-AZ subnet-group requirement.
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.2.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-query-training-subnet-b'
        - Key: Environment
          Value: !Ref EnvironmentName

  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Metadata:
      Purpose: >-
        Security group for the Aurora cluster. Intentionally declares NO ingress
        rules -- access is exclusively via the RDS Data API (an AWS-managed
        HTTPS endpoint), so nothing connects to port 5432 directly. See the
        inline comment for the egress rationale.
    # No ingress or egress rules are declared, and both omissions are deliberate.
    #
    # Ingress: the cluster is reached exclusively through the RDS Data API, an
    # AWS-managed HTTPS endpoint that does not traverse this security group. No
    # client ever opens a direct PostgreSQL connection to the cluster, so there
    # is nothing to allow in on port 5432.
    #
    # Egress: omitting SecurityGroupEgress means CloudFormation applies the
    # default allow-all-outbound rule. That is left as-is on purpose rather than
    # locked down, for two reasons. First, the cluster lives in private subnets
    # with no NAT gateway (see VPC below), so "allow all to 0.0.0.0/0" has no
    # actual route off the VPC -- it is unrestricted in name only. Second,
    # Aurora Serverless v2's internal communication with the managed storage and
    # monitoring layer is not something a Data-API-only workload initiates
    # through this group, and clamping egress on the managed instance is a change
    # that cannot be validated without a full deploy. For a disposable,
    # event-scoped cluster with no internet path, the default is acceptable.
    Properties:
      GroupDescription: Security group for query training Aurora PostgreSQL cluster (Data API only, no ingress needed)
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-aurora-query-training-sg'
        - Key: Environment
          Value: !Ref EnvironmentName

  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Metadata:
      Purpose: >-
        Groups SubnetA and SubnetB so Aurora can place the cluster across two
        AZs.
    Properties:
      DBSubnetGroupDescription: Subnet group for query training Aurora cluster
      SubnetIds:
        - !Ref SubnetA
        - !Ref SubnetB
      Tags:
        - Key: Environment
          Value: !Ref EnvironmentName

  # ---------------------------------------------------------------------------
  # Aurora Serverless v2 Cluster
  # ---------------------------------------------------------------------------
  AuroraCluster:
    Type: AWS::RDS::DBCluster
    Metadata:
      Purpose: >-
        Aurora PostgreSQL Serverless v2 cluster, seeded with cosmetics-sales
        data and pg_stat_statements query history at deploy time. This is the
        training-data source for Lab 1 and the live database the evaluator runs
        candidate SQL against in Labs 2-4.
    # CloudFormation's default DeletionPolicy for RDS resources is Snapshot, not
    # Delete -- so without these two lines a stack deletion leaves a manual
    # snapshot behind that CloudFormation will never clean up. The data here is
    # entirely disposable: the cluster is seeded from a CSV in S3 and repopulated
    # by DbInitFunction on every deploy, so there is nothing worth retaining.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBClusterIdentifier: !Sub '${EnvironmentName}-query-training-cluster'
      Engine: aurora-postgresql
      EngineVersion: !Ref AuroraEngineVersion
      DatabaseName: !Ref DBName
      MasterUsername: !Sub '{{resolve:secretsmanager:${RDSSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${RDSSecret}:SecretString:password}}'
      DBSubnetGroupName: !Ref DBSubnetGroup
      VpcSecurityGroupIds:
        - !GetAtt RDSSecurityGroup.GroupId
      EnableHttpEndpoint: true
      EnableIAMDatabaseAuthentication: true
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref MinACU
        MaxCapacity: !Ref MaxACU
      # Encrypted at rest with the AWS-managed aws/rds key (no KmsKeyId). Fine
      # for a disposable workshop account. For production, add KmsKeyId
      # referencing a customer-managed key (CMK) to get key rotation, CloudTrail
      # decrypt auditing, and key-policy control over who can decrypt. See the
      # encryption note in content/index.en.md for the full rationale.
      StorageEncrypted: true
      BackupRetentionPeriod: !Ref BackupRetentionPeriod
      DeletionProtection: false
      CopyTagsToSnapshot: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-query-training-cluster'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: query-training-pipeline

  AuroraInstance:
    Type: AWS::RDS::DBInstance
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_118
            comment: >-
              Enhanced monitoring not enabled: extra telemetry/cost not
              warranted for a single-use cluster reclaimed after the event.
      Purpose: >-
        The single Serverless v2 instance in the cluster. One instance is
        sufficient for the workshop's read-mostly workload; DeletionPolicy is
        Delete because the data is regenerated on every deploy.
    # Same reasoning as AuroraCluster above: RDS defaults to Snapshot.
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub '${EnvironmentName}-query-training-instance-1'
      DBClusterIdentifier: !Ref AuroraCluster
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless
      PubliclyAccessible: false
      AutoMinorVersionUpgrade: true
      Tags:
        - Key: Name
          Value: !Sub '${EnvironmentName}-query-training-instance-1'
        - Key: Environment
          Value: !Ref EnvironmentName
        - Key: Project
          Value: query-training-pipeline

  SecretTargetAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Metadata:
      Purpose: >-
        Links RDSSecret to the Aurora cluster so Secrets Manager records the
        connection details and the RDS Data API can resolve credentials by
        secret ARN.
    Properties:
      SecretId: !Ref RDSSecret
      TargetId: !Ref AuroraCluster
      TargetType: AWS::RDS::DBCluster

  # ---------------------------------------------------------------------------
  # Custom Resource: Create product_sales table and load CSV data
  # ---------------------------------------------------------------------------
  DbInitLambdaRole:
    Type: AWS::IAM::Role
    Metadata:
      Purpose: >-
        Execution role for DbInitFunction. Grants only the rds-data and
        Secrets Manager access needed to create and seed the product_sales
        table, plus S3 read for the CSV/queries assets and CloudWatch Logs.
    Properties:
      RoleName: !Sub '${EnvironmentName}-db-init-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: RdsDataApiAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - rds-data:ExecuteStatement
                  - rds-data:BatchExecuteStatement
                Resource: !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:cluster:${AuroraCluster}'
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref RDSSecret
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource:
                  - !Sub 'arn:${AWS::Partition}:s3:::${SlmWeightsBucket}/cosmetics_sales_synthetic_data.csv'
                  - !Sub 'arn:${AWS::Partition}:s3:::${SlmWeightsBucket}/queries.txt'
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${SlmWeightsBucket}'

  DbInitFunction:
    Type: AWS::Lambda::Function
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: >-
              No reserved concurrency: a one-shot deploy-time custom resource,
              not a request-serving function.
          - id: CKV_AWS_116
            comment: >-
              No DLQ: runs once synchronously at stack create; failures surface
              via CloudFormation, there are no async retries to capture.
          - id: CKV_AWS_117
            comment: >-
              Not VPC-attached: reaches S3 and Aurora only through AWS API
              endpoints (RDS Data API), so a VPC would add NAT/endpoints for no
              benefit.
          - id: CKV_AWS_173
            comment: >-
              Env vars hold only ARNs/names, never secrets (the DB password
              comes from Secrets Manager at runtime); the default AWS-owned key
              suffices. See index.en.md.
      Purpose: >-
        Custom-resource Lambda that runs once at stack create: creates the
        product_sales table, seeds it from the CSV in S3, and replays ~250
        queries so pg_stat_statements holds the history Lab 1 extracts.
    # SlmWeightsBucket is listed for clarity, but note it does NOT fix a race:
    # this is the inline-ZipFile Lambda RESOURCE, whose creation reads no S3.
    # The S3 get_object calls happen at INVOKE time, driven by
    # DbInitCustomResource, and the real ordering guarantee lives there --
    # DbInitCustomResource DependsOn CopyAssetsCustomResource, which is what
    # actually copies the CSV and queries.txt INTO the bucket. An empty bucket
    # would fail get_object just as a missing one would, so "bucket exists" is
    # not the correct precondition; "objects are present" is, and that is
    # already guaranteed downstream.
    DependsOn:
      - AuroraInstance
      - SlmWeightsBucket
    Properties:
      FunctionName: !Sub '${EnvironmentName}-db-init-product-sales'
      Runtime: !Ref LambdaRuntime
      Handler: index.handler
      Timeout: !Ref DbInitFunctionTimeout
      MemorySize: !Ref DbInitFunctionMemorySize
      Role: !GetAtt DbInitLambdaRole.Arn
      Environment:
        Variables:
          CLUSTER_ARN: !Sub 'arn:${AWS::Partition}:rds:${AWS::Region}:${AWS::AccountId}:cluster:${AuroraCluster}'
          SECRET_ARN: !Ref RDSSecret
          DATABASE: !Ref DBName
          BUCKET: !Ref SlmWeightsBucket
          CSV_KEY: cosmetics_sales_synthetic_data.csv
          QUERIES_KEY: queries.txt
          # Data API resume/retry tuning -- see the DbInit* parameters. Numbers
          # arrive as strings in the environment, so the handler casts them.
          RETRY_ATTEMPTS: !Ref DbInitRetryAttempts
          RETRY_DELAY: !Ref DbInitRetryDelay
          QUERY_DELAY: !Ref DbInitQueryDelay
      Code:
        ZipFile: |
          import csv
          import io
          import os
          import time
          import boto3
          # cfnresponse is injected automatically into inline-ZipFile Python
          # functions. It handles the pre-signed PUT with retries and manages
          # PhysicalResourceId correctly -- both of which the hand-rolled
          # urllib version this replaced got wrong. CopyAssetsFunction below
          # already uses it.
          import cfnresponse

          s3 = boto3.client('s3')
          rds_data = boto3.client('rds-data')

          CLUSTER_ARN = os.environ['CLUSTER_ARN']
          SECRET_ARN = os.environ['SECRET_ARN']
          DATABASE = os.environ['DATABASE']
          BUCKET = os.environ['BUCKET']
          CSV_KEY = os.environ['CSV_KEY']
          QUERIES_KEY = os.environ['QUERIES_KEY']

          # Retry/sleep tuning from the DbInit* stack parameters. Env vars are
          # strings, so cast: attempts/delay are ints, the per-query pause a float.
          RETRY_ATTEMPTS = int(os.environ.get('RETRY_ATTEMPTS', '10'))
          RETRY_DELAY = int(os.environ.get('RETRY_DELAY', '15'))
          QUERY_DELAY = float(os.environ.get('QUERY_DELAY', '0.1'))

          CREATE_TABLE_SQL = """
          CREATE TABLE IF NOT EXISTS product_sales (
              sale_id INTEGER PRIMARY KEY,
              product_name VARCHAR(255) NOT NULL,
              product_category VARCHAR(100) NOT NULL,
              brand VARCHAR(100) NOT NULL,
              brand_tier VARCHAR(50) NOT NULL,
              price NUMERIC(10,2) NOT NULL,
              volume_ml INTEGER,
              quantity INTEGER NOT NULL,
              country_code VARCHAR(5) NOT NULL,
              sale_date DATE NOT NULL,
              launch_date DATE,
              customer_segment VARCHAR(50) NOT NULL,
              target_age_group VARCHAR(20),
              certification_tags TEXT,
              ingredients_type VARCHAR(50),
              season_tag VARCHAR(50),
              rating NUMERIC(2,1),
              stock_status VARCHAR(20) NOT NULL,
              sales_rank INTEGER
          );
          """

          INSERT_SQL = """
          INSERT INTO product_sales (
              sale_id, product_name, product_category, brand, brand_tier,
              price, volume_ml, quantity, country_code, sale_date,
              launch_date, customer_segment, target_age_group, certification_tags,
              ingredients_type, season_tag, rating, stock_status, sales_rank
          ) VALUES (
              :sale_id::integer, :product_name, :product_category, :brand, :brand_tier,
              :price::numeric, :volume_ml::integer, :quantity::integer, :country_code, :sale_date::date,
              :launch_date::date, :customer_segment, :target_age_group, :certification_tags,
              :ingredients_type, :season_tag, :rating::numeric, :stock_status, :sales_rank::integer
          )
          ON CONFLICT (sale_id) DO NOTHING
          """

          BATCH_SIZE = 50

          # Fail the stack if fewer than this many of the queries in queries.txt
          # land in pg_stat_statements. Lab 1 extracts its training data from
          # that view, so an empty or nearly-empty query history produces a
          # green stack that breaks the workshop half an hour later, in a lab
          # that has nothing to do with the actual cause. Partial failure is
          # survivable -- Lab 1 needs roughly 200 samples -- so this is a floor,
          # not an exact count.
          MIN_QUERIES_EXECUTED = 200


          def wait_for_data_api(attempts=RETRY_ATTEMPTS, delay=RETRY_DELAY):
              """Block until Aurora answers a trivial Data API call.

              DependsOn: AuroraInstance only guarantees the cluster is
              'available' to CloudFormation. Serverless v2 scaled to MinACU can
              still reject the first Data API call with DatabaseResumingException
              while it wakes up. Without this, one transient error on the very
              first statement fails the whole stack.
              """
              for attempt in range(1, attempts + 1):
                  try:
                      rds_data.execute_statement(
                          resourceArn=CLUSTER_ARN,
                          secretArn=SECRET_ARN,
                          database=DATABASE,
                          sql='SELECT 1',
                      )
                      print(f'Data API ready after {attempt} attempt(s)')
                      return
                  except rds_data.exceptions.DatabaseResumingException:
                      print(f'Aurora still resuming (attempt {attempt}/{attempts}), waiting {delay}s')
                      time.sleep(delay)
                  except Exception as e:
                      # BadRequestException wrapping a resume message shows up on
                      # some paths instead of the typed exception, so match on
                      # text too rather than failing fast on a retryable error.
                      if 'resuming' in str(e).lower() or 'not currently available' in str(e).lower():
                          print(f'Aurora not ready (attempt {attempt}/{attempts}): {e}')
                          time.sleep(delay)
                      else:
                          raise
              raise RuntimeError(
                  f'Aurora Data API did not become available after {attempts} attempts'
              )


          def execute_sql(sql, params=None):
              kwargs = {
                  'resourceArn': CLUSTER_ARN,
                  'secretArn': SECRET_ARN,
                  'database': DATABASE,
                  'sql': sql,
              }
              if params:
                  kwargs['parameters'] = params
              return rds_data.execute_statement(**kwargs)


          def build_param(name, value, type_hint=None):
              if value is None or value == '':
                  return {'name': name, 'value': {'isNull': True}}
              field = {'name': name, 'value': {'stringValue': str(value)}}
              if type_hint:
                  field['typeHint'] = type_hint
              return field


          def row_to_params(row):
              return [
                  build_param('sale_id', row.get('sale_id')),
                  build_param('product_name', row.get('product_name')),
                  build_param('product_category', row.get('product_category')),
                  build_param('brand', row.get('brand')),
                  build_param('brand_tier', row.get('brand_tier')),
                  build_param('price', row.get('price')),
                  build_param('volume_ml', row.get('volume_ml')),
                  build_param('quantity', row.get('quantity')),
                  build_param('country_code', row.get('country_code')),
                  build_param('sale_date', row.get('sale_date'), 'DATE'),
                  build_param('launch_date', row.get('launch_date'), 'DATE'),
                  build_param('customer_segment', row.get('customer_segment')),
                  build_param('target_age_group', row.get('target_age_group')),
                  build_param('certification_tags', row.get('certification_tags')),
                  build_param('ingredients_type', row.get('ingredients_type')),
                  build_param('season_tag', row.get('season_tag')),
                  build_param('rating', row.get('rating')),
                  build_param('stock_status', row.get('stock_status')),
                  build_param('sales_rank', row.get('sales_rank')),
              ]


          def load_csv_data():
              obj = s3.get_object(Bucket=BUCKET, Key=CSV_KEY)
              content = obj['Body'].read().decode('utf-8')
              reader = csv.DictReader(io.StringIO(content))

              batch = []
              total_inserted = 0
              for row in reader:
                  batch.append({'parameterSets': row_to_params(row)})
                  if len(batch) >= BATCH_SIZE:
                      param_sets = [item['parameterSets'] for item in batch]
                      rds_data.batch_execute_statement(
                          resourceArn=CLUSTER_ARN,
                          secretArn=SECRET_ARN,
                          database=DATABASE,
                          sql=INSERT_SQL,
                          parameterSets=param_sets,
                      )
                      total_inserted += len(batch)
                      batch = []

              if batch:
                  param_sets = [item['parameterSets'] for item in batch]
                  rds_data.batch_execute_statement(
                      resourceArn=CLUSTER_ARN,
                      secretArn=SECRET_ARN,
                      database=DATABASE,
                      sql=INSERT_SQL,
                      parameterSets=param_sets,
                  )
                  total_inserted += len(batch)

              print(f'Successfully inserted {total_inserted} rows into product_sales')
              return total_inserted


          def run_queries():
              obj = s3.get_object(Bucket=BUCKET, Key=QUERIES_KEY)
              content = obj['Body'].read().decode('utf-8')
              queries = [q.strip() for q in content.splitlines() if q.strip()]

              executed = 0
              failed = 0
              for query in queries:
                  try:
                      execute_sql(query)
                      executed += 1
                  except Exception as e:
                      print(f'Query failed: {query[:80]}... Error: {e}')
                      failed += 1
                  if QUERY_DELAY:
                      time.sleep(QUERY_DELAY)

              print(f'Executed {executed} queries successfully, {failed} failed')

              # Individual failures stay tolerated -- pg_stat_statements only
              # needs enough history for Lab 1 -- but total failure must not
              # report SUCCESS. Before this check, all 250 queries could fail
              # and the stack would still go green.
              if executed < MIN_QUERIES_EXECUTED:
                  raise RuntimeError(
                      f'Only {executed} of {len(queries)} queries executed '
                      f'(minimum {MIN_QUERIES_EXECUTED}). pg_stat_statements will '
                      'not hold enough query history for Lab 1 to extract '
                      'training data. See the per-query errors above.'
                  )

              return executed, failed


          def handler(event, context):
              request_type = event.get('RequestType')
              try:
                  if request_type == 'Delete':
                      # Nothing to undo: the table lives inside the Aurora
                      # cluster, which CloudFormation deletes itself.
                      cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                      return

                  # Wait for Serverless v2 to be awake before the first real
                  # statement, so a resume in progress is a delay and not a
                  # stack failure.
                  wait_for_data_api()

                  # Create table
                  execute_sql(CREATE_TABLE_SQL)

                  # Load CSV data into the table
                  rows = load_csv_data()

                  # Run all queries to populate query history. Raises if too
                  # few succeed -- see MIN_QUERIES_EXECUTED.
                  executed, failed = run_queries()

                  cfnresponse.send(event, context, cfnresponse.SUCCESS, {
                      'RowsInserted': rows,
                      'QueriesExecuted': executed,
                      'QueriesFailed': failed,
                  })

              except Exception as e:
                  print(f'Error on {request_type}: {e}')
                  # Truncate: CloudFormation rejects a Reason longer than
                  # 4096 bytes, and losing the signal entirely would hang the
                  # stack for the full custom-resource timeout.
                  cfnresponse.send(
                      event, context, cfnresponse.FAILED, {}, reason=str(e)[:1000]
                  )

  DbInitCustomResource:
    Type: Custom::DbInit
    DependsOn:
      - AuroraInstance
      - SecretTargetAttachment
      # DbInitFunction reads cosmetics_sales_synthetic_data.csv and queries.txt
      # from SlmWeightsBucket, and CopyAssetsCustomResource is what puts them
      # there. Without this edge CloudFormation may run both concurrently and
      # the get_object calls fail with NoSuchKey. Today that is masked only by
      # Aurora taking 5-10 minutes to provision while the copy takes seconds --
      # a timing coincidence, not a guarantee.
      - CopyAssetsCustomResource
    Metadata:
      Purpose: >-
        Invokes DbInitFunction at deploy time to create the product_sales
        table, seed it from the CSV in S3, and replay ~250 queries so
        pg_stat_statements holds the query history Lab 1 extracts. Fires only
        on Create; the Delete path is a no-op because Aurora owns the data.
    Properties:
