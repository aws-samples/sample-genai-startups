[project]
name = "aws-inference-reliability"
version = "0.2.0"
description = "Runnable Amazon Bedrock and AgentCore examples for inference reliability."
requires-python = ">=3.10,<3.14"
dependencies = [
    "bedrock-agentcore>=1.20.0",
    "boto3>=1.42.0",
    "litellm[proxy]>=1.75.9,<=1.91.1",
    "openai>=1.68.0,<3.0.0",
    "strands-agents[litellm]>=1.50.0",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
